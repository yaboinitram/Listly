# T-28, T-29: run the server's unit and integration tests on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  api-tests:
    name: API tests # T-30 requires this check by name
    runs-on: ubuntu-latest

    # T-29: a MySQL 8 database for the integration tests, set up like docker-compose.yml
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: listly_test
          MYSQL_USER: listly_app
          MYSQL_PASSWORD: devpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_USER: listly_app
      DB_PASSWORD: devpass
      DB_NAME: listly_test

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test